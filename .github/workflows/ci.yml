name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows, GNU toolchain)
    runs-on: windows-latest
    env:
      # Same toolchain as rust-toolchain.toml. Set here too because rustup 1.28.0/1.28.1
      # reject a host tuple in the file's channel field; the variable takes precedence.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting (rustfmt.toml)
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload the executable
        uses: actions/upload-artifact@v5
        with:
          name: freenapse-windows-x64
          path: target/release/freenapse.exe
          if-no-files-found: error

